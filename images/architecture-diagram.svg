<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="arch-title arch-desc" font-family="IBM Plex Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="arch-title">Encoder-decoder architecture with a joint classification head</title>
<desc id="arch-desc">A 256 by 256 by 3 fundus image passes through four convolution-and-maxpool blocks (channel depth 16, 32, 64, 128) into a 16 by 16 by 128 bottleneck. From that shared bottleneck, one branch mirrors the encoder back up through four transpose-convolution blocks to a 256 by 256 by 3 reconstruction, compared to the input with a reconstruction loss. A second branch feeds fully connected layers ending in a 5-class softmax over the diabetic retinopathy severity grades, compared to the true label with a cross-entropy loss. Both losses are summed and trained jointly.</desc>
<rect x="0" y="0" width="1080" height="460" rx="16" fill="#221B14" stroke="#2D2418"/>
<text x="65"  y="24" text-anchor="middle" font-size="12" fill="#F3ECE4">input</text>
<text x="753" y="24" text-anchor="middle" font-size="12" fill="#F3ECE4">reconstruction</text>
<text x="212" y="46" text-anchor="middle" font-size="13" letter-spacing="0.02em" fill="#BBB0A4">encoder — conv 3×3 + maxpool 2×2</text>
<text x="596" y="46" text-anchor="middle" font-size="13" letter-spacing="0.02em" fill="#BBB0A4">decoder — convtranspose 2×2 / 3×3</text>
<text x="409" y="66" text-anchor="middle" font-size="12" fill="#BBB0A4">reconstruction loss — MSE(input, reconstruction)</text>
<path d="M 65 105 L 65 76 L 753 76 L 753 105" fill="none" stroke="#8C8074" stroke-width="1"/>
