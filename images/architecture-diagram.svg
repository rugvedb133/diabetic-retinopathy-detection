<rect x="122" y="114.0" width="64" height="72" rx="6" fill="#D57027"/><text x="154.0" y="206.0" text-anchor="middle" font-size="12" fill="#BBB0A4">128²</text><text x="154.0" y="221.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×16</text>
<rect x="208" y="122.0" width="64" height="56" rx="6" fill="#B85F24"/><text x="240.0" y="198.0" text-anchor="middle" font-size="12" fill="#BBB0A4">64²</text><text x="240.0" y="213.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×32</text>
<rect x="294" y="130.0" width="64" height="40" rx="6" fill="#A15425"/><text x="326.0" y="190.0" text-anchor="middle" font-size="12" fill="#BBB0A4">32²</text><text x="326.0" y="205.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×64</text>
<rect x="380" y="137.0" width="52" height="26" rx="6" fill="#4D311E"/><text x="406.0" y="183.0" text-anchor="middle" font-size="12" fill="#BBB0A4">16²</text><text x="406.0" y="198.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×128</text>
<rect x="454" y="130.0" width="64" height="40" rx="6" fill="#A15425"/><text x="486.0" y="190.0" text-anchor="middle" font-size="12" fill="#BBB0A4">32²</text><text x="486.0" y="205.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×64</text>
<rect x="540" y="122.0" width="64" height="56" rx="6" fill="#B85F24"/><text x="572.0" y="198.0" text-anchor="middle" font-size="12" fill="#BBB0A4">64²</text><text x="572.0" y="213.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×32</text>
<rect x="626" y="114.0" width="64" height="72" rx="6" fill="#D57027"/><text x="658.0" y="206.0" text-anchor="middle" font-size="12" fill="#BBB0A4">128²</text><text x="658.0" y="221.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×16</text>
<rect x="718" y="105.0" width="70" height="90" rx="6" fill="#DCAE94"/><text x="753.0" y="215.0" text-anchor="middle" font-size="12" fill="#BBB0A4">256²</text><text x="753.0" y="230.0" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="11" fill="#8C8074">×3</text>
<text x="406.0" y="215" text-anchor="middle" font-size="12" fill="#D57027">shared bottleneck (z)</text>
